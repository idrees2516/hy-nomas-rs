[workspace]
resolver = "2"
members = ["nomas-core", "nomas-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Tencent-Hunyuan/Hy-Nomas"
description = "Rust port of the Hy-Nomas interactive video world model core"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
