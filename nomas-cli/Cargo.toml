[package]
name = "nomas-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Interactive CLI for the Hy-Nomas Rust port"

[dependencies]
nomas-core = { path = "../nomas-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.104"
candle-core = "0.11.1"

[[bin]]
name = "nomas"
path = "src/main.rs"
